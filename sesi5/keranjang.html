<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keranjang Belanja</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a>TokoFR</a>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>Keranjang Belanja</h2>
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>Produk</th>
                    <th>Harga</th>
                    <th>Jumlah</th>
                    <th>Total</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="keranjang-body">
                <!-- Produk dalam keranjang akan dimuat di sini -->
            </tbody>
        </table>
        <h4 class="text-end">Total Harga: <span id="total-harga">Rp 0</span></h4>
        <a href="checkout.html" class="btn btn-success">Checkout</a>
        <a href="sesi5.html" class="btn btn-secondary">Lanjut Belanja</a>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            let keranjang = JSON.parse(localStorage.getItem("keranjang")) || [];
            const keranjangBody = document.getElementById("keranjang-body");
            const totalHargaEl = document.getElementById("total-harga");

            function updateKeranjang() {
                keranjangBody.innerHTML = "";
                let totalHarga = 0;
                keranjang.forEach((item, index) => {
                    let totalItem = item.harga * item.jumlah;
                    totalHarga += totalItem;
                    keranjangBody.innerHTML += `
                        <tr>
                            <td>${item.nama}</td>
                            <td>Rp ${item.harga.toLocaleString()}</td>
                            <td>${item.jumlah}</td>
                            <td>Rp ${totalItem.toLocaleString()}</td>
                            <td><button class="btn btn-danger btn-sm" onclick="hapusItem(${index})">Hapus</button></td>
                        </tr>
                    `;
                });
                totalHargaEl.textContent = `Rp ${totalHarga.toLocaleString()}`;
                localStorage.setItem("keranjang", JSON.stringify(keranjang));
            }

            window.hapusItem = function(index) {
                keranjang.splice(index, 1);
                updateKeranjang();
            }

            updateKeranjang();
        });
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
